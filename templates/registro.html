{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="tarjeta-auth">
    <h1>Crear cuenta</h1>
    <form method="POST" action="{{ url_for('auth.registro') }}">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required autofocus>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="6">

        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" required minlength="6">

        <button type="submit">Registrarme</button>
    </form>
    <p class="enlace">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
</div>
{% endblock %}
