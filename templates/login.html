<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesion | Teen Shoes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <a class="brand" href="{{ url_for('users.dashboard') }}"><span class="brand-mark">◔</span><strong>Teen Shoes</strong></a>
            <h1>Iniciar sesion</h1>
            <p class="auth-subtitle">Ingresa tus datos para acceder a tu cuenta.</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="auth-flashes">
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>

                <label for="password">Contrasena</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Entrar</button>
            </form>

            <p class="auth-switch">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Registrate</a></p>
        </div>
    </div>
</body>
</html>
